<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Operations Demo</title>
<style>
:root{--ink:#15221b;--muted:#69756e;--paper:#f4f1ea;--panel:#fffdfa;--line:#d9dfd9;--green:#176b4b;--shadow:0 20px 55px rgba(39,55,45,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#eaf3ec 0,transparent 36%),var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.page{min-height:100vh;display:flex;flex-direction:column}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:900;font-size:12px}.brand strong{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.top a{color:var(--muted);text-decoration:none;font-size:11px}.wrap{width:min(700px,calc(100% - 28px));margin:8px auto 24px;flex:1;display:flex}.chatShell{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;width:100%;min-height:720px}.chatHead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fffefa}.advisor{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#247757,#0f5a3c);display:grid;place-items:center;color:#fff;font-weight:850}.advisor b{font-size:13px}.advisor small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.status i{width:7px;height:7px;border-radius:50%;background:#29a26e}.messages{flex:1;min-height:480px;max-height:610px;overflow:auto;padding:22px;background:#efebe3;background-image:radial-gradient(rgba(76,94,82,.07) .7px,transparent .7px);background-size:17px 17px}.bubble{max-width:78%;padding:11px 13px;border-radius:15px;margin:8px 0;font-size:13px;line-height:1.5;box-shadow:0 2px 7px rgba(31,47,38,.07);white-space:pre-wrap}.bubble.customer{margin-left:auto;background:#d7f3e6;border-bottom-right-radius:4px}.bubble.assistant{background:#fff;border-bottom-left-radius:4px}.bubble.notice{margin:10px auto;max-width:92%;background:#fff8df;color:#705000;text-align:center;font-size:11px}.bubble.error{background:#fff0ed;color:#7a2f2f}.meta{font-size:9px;color:#8a958e;margin-top:6px;text-align:right}.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#87948c;animation:pulse 1.1s infinite}.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}@keyframes pulse{0%,70%,100%{opacity:.25}35%{opacity:1;transform:translateY(-2px)}}.cards{display:grid;gap:9px;margin:10px 0;max-width:88%}.vehicle,.booking{background:#fff;border:1px solid #cddbd2;border-radius:14px;padding:12px;box-shadow:0 2px 7px rgba(31,47,38,.06)}.vehicle strong,.booking strong{display:block;font-size:12px}.vehicle small,.booking small{display:block;color:var(--muted);font-size:10px;line-height:1.55;margin:5px 0}.vehicle button,.booking button{border:0;background:var(--green);color:#fff;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer}.booking{margin:10px 0;max-width:88%}.bookingGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.booking label{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}.booking input,.booking select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.quick{display:none;gap:7px;padding:10px 14px 0;overflow:auto;background:#fffefa}.quick.show{display:flex}.quick button{white-space:nowrap;border:1px solid #c9ddd2;background:#f8fffb;color:#1d654b;border-radius:99px;padding:7px 10px;font-size:10px;cursor:pointer}.composer{padding:12px 14px 14px;background:#fffefa;display:grid;grid-template-columns:1fr 44px;gap:9px}.composer textarea{resize:none;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 13px;outline:none;min-height:48px;max-height:120px}.composer textarea:focus{border-color:#6ba98f;box-shadow:0 0 0 3px #e1f1e9}.send{border:0;background:var(--green);color:#fff;border-radius:15px;cursor:pointer;font-size:18px}.send:disabled{opacity:.45}.foot{text-align:center;padding:0 14px 12px;background:#fffefa;color:#929a95;font-size:9px}.reset{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}@media(max-width:720px){.top{padding:0 14px;height:58px}.top a{display:none}.wrap{width:100%;margin:0;flex:1}.chatShell{border-radius:0;border-left:0;border-right:0;min-height:calc(100vh - 58px);box-shadow:none}.messages{max-height:none}.bubble{max-width:88%}.cards,.booking{max-width:95%}.bookingGrid{grid-template-columns:1fr}}
.slotChoices{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0;max-width:92%}.slotChoices button{border:1px solid #b9d7c6;background:#fff;color:#176b4b;border-radius:99px;padding:8px 11px;font-size:10px;cursor:pointer}.stateLine{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#597267;margin-bottom:6px;font-weight:800}
</style>
</head>
<body>
<!-- Regression markers only: WhatsApp-style demo transport; Open Operations Console; not affiliated with Toyota -->
<div class="page">
<header class="top"><div class="brand"><div class="mark">AI</div><div><strong>Customer Operations</strong><small>Service-first assistant</small></div></div><div><button class="reset" onclick="newConversation()">New conversation</button> · <a href="/">Manager dashboard</a></div></header>
<main class="wrap"><section class="chatShell" aria-label="Demo messaging">
<div class="chatHead"><div class="advisor"><div class="avatar">AI</div><div><b>Service Concierge</b><small>Bookings, vehicle concerns &amp; advisor handoff</small></div></div><div class="status" id="routeStatus"><i></i><span>Online</span></div></div>
<div class="messages" id="messages" aria-live="polite"><div class="bubble assistant">Hi — I’m the customer care assistant. Before we begin, what should I call you?<div class="meta">Customer Care</div></div></div>
<div class="quick" id="quick"><button onclick="usePrompt('My car needs its 40,000 km service. Can I come Saturday?')">Book a service</button><button onclick="usePrompt('I need to change an appointment')">Change appointment</button><button onclick="usePrompt('My brakes are making a grinding noise')">Vehicle concern</button><button onclick="usePrompt('I want to speak to an advisor')">Talk to an advisor</button><button onclick="usePrompt('I need an automatic car under 20 lakh')">Explore vehicles</button></div>
<div class="composer"><textarea id="message" rows="1" placeholder="Type your name…" aria-label="Customer message"></textarea><button class="send" id="sendButton" onclick="sendMessage()" aria-label="Send message">➜</button></div>
<div class="foot">Demo environment · synthetic vehicle and customer data</div>
</section></main></div>
<script>
const directRoutes={inbound:'/api/channels/inbound',appointment:'/api/appointments'};
let config={routes:{inbound:{transport:'direct',url:directRoutes.inbound},appointment:{transport:'direct',url:directRoutes.appointment}}};
let conversationLeadId=null,currentVehicle=null,bookingKey=null,lastBookingPayload=null,lastFailedPayload=null;
let customerName='',customerPhone='',customerEmail='',onboarding='name';
const sessionId=`demo-${Date.now()}-${Math.random().toString(16).slice(2,8)}`;
const syntheticPhone=`synthetic-${Date.now()}`;
const el=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function formatMessage(value){return esc(value).replace(/\n/g,'<br>')}
const money=value=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(value);
async function request(url,options={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),120000);try{const response=await fetch(url,{headers:{'Content-Type':'application/json'},signal:controller.signal,...options});let body;try{body=await response.json()}catch{body={detail:'The service returned an invalid response.'}}if(!response.ok)throw body;return body}finally{clearTimeout(timer)}}
function route(name){return config.routes?.[name]?.url||directRoutes[name]}
function addBubble(text,type='assistant',meta=''){const node=document.createElement('div');node.className=`bubble ${type}`;node.innerHTML=`${formatMessage(text)}${meta?`<div class="meta">${esc(meta)}</div>`:''}`;el('messages').appendChild(node);el('messages').scrollTop=el('messages').scrollHeight;return node}
function addTyping(){const node=document.createElement('div');node.className='bubble assistant';node.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';el('messages').appendChild(node);el('messages').scrollTop=el('messages').scrollHeight;return node}
function addInventory(rows){if(!rows?.length)return;const wrap=document.createElement('div');wrap.className='cards';rows.slice(0,3).forEach((row,index)=>{const card=document.createElement('div');card.className='vehicle';card.innerHTML=`<strong>${esc(row.model)} ${esc(row.variant)}</strong><small>${esc(row.colour)} · ${esc(row.branch)}<br>${money(row.demo_price_inr)} · expected delivery ${esc(row.expected_delivery_days)} day(s)</small><button onclick="prepareBooking(${index})">Request test drive</button>`;wrap.appendChild(card)});el('messages').appendChild(wrap);window.lastInventory=rows;el('messages').scrollTop=el('messages').scrollHeight}
function addServiceState(booking){if(!booking)return;if(['ALTERNATIVES_OFFERED','AWAITING_SLOT_SELECTION'].includes(booking.status)){const options=[...(booking.available||[]),...(booking.alternatives||[])];if(options.length){const wrap=document.createElement('div');wrap.className='slotChoices';options.forEach(option=>{const button=document.createElement('button');button.textContent=`${option.label} · ${option.branch}`;button.onclick=()=>usePrompt(`${option.label} at ${option.branch} works`);wrap.appendChild(button)});el('messages').appendChild(wrap)}}if(booking.status==='AWAITING_CONFIRMATION')showServiceConfirmation(booking);if(booking.status==='ESCALATED')addBubble('Priority case created · routine auto-booking paused','notice')}
function showServiceConfirmation(booking){el('bookingCard')?.remove();const card=document.createElement('div');card.className='booking';card.id='bookingCard';card.innerHTML=`<div class="stateLine">Awaiting explicit confirmation</div><strong>${esc(booking.service)}</strong><small>${esc(booking.slot.label)} · ${esc(booking.slot.branch)}<br>Availability will be rechecked before commit.</small><div class="bookingGrid"><div><label>Name</label><input id="contactName" value="${esc(customerName)}" autocomplete="name"></div><div><label>Phone</label><input id="contactPhone" value="${esc(customerPhone)}" placeholder="e.g. +91 98…" autocomplete="tel"></div><div><label>Email</label><input id="contactEmail" value="${esc(customerEmail)}" type="email" placeholder="you@example.com" autocomplete="email"></div></div><button style="margin-top:10px" onclick="bookServiceAppointment()">Confirm service appointment</button>`;card.dataset.booking=JSON.stringify(booking);el('messages').appendChild(card);card.scrollIntoView({behavior:'smooth',block:'nearest'})}
function usePrompt(value){el('message').value=value;el('message').focus()}
async function processPayload(payload,url){const typing=addTyping();el('sendButton').disabled=true;try{const data=await request(url,{method:'POST',body:JSON.stringify(payload)});typing.remove();conversationLeadId=data.lead.id;lastFailedPayload=null;addBubble(data.reply,'assistant','Customer Care');addServiceState(data.service_booking);addInventory(data.inventory_matches||[]);if(data.approval?.approval_required)addBubble('Your request has been sent for manager review. No discount has been promised.','notice');return data}catch(error){typing.remove();lastFailedPayload=payload;addBubble('I could not complete that request through the configured route. You can retry safely.','error','Temporary service issue');if(config.routes?.inbound?.transport==='n8n'){const node=document.createElement('div');node.className='bubble notice';node.innerHTML='<button onclick="retryDirect()" style="border:0;background:#176b4b;color:#fff;border-radius:9px;padding:8px 10px;cursor:pointer">Retry safely</button>';el('messages').appendChild(node)}return null}finally{el('sendButton').disabled=false;el('message').focus()}}
async function bookServiceAppointment(){const card=el('bookingCard');if(!card||!conversationLeadId)return;const booking=JSON.parse(card.dataset.booking),name=(el('contactName')?.value||'').trim(),phone=(el('contactPhone')?.value||'').trim(),email=(el('contactEmail')?.value||'').trim();if(!name||phone.length<6||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){addBubble('Please confirm your name, phone number and email address first.','notice');return}customerName=name;customerPhone=phone;customerEmail=email;const payload={lead_id:conversationLeadId,kind:'service',branch:booking.slot.branch,scheduled_for:booking.slot.starts_at,idempotency_key:booking.idempotency_key,service_request_id:booking.service_request_id,slot_id:booking.slot.slot_id,contact_name:name,contact_phone:phone,contact_email:email};lastBookingPayload=payload;try{const data=await request(route('appointment'),{method:'POST',body:JSON.stringify(payload)});card.remove();if(data.confirmed){addBubble(data.created?`Confirmed — your service appointment is booked for ${booking.slot.label} at ${booking.slot.branch}. Your CRM record and operations timeline are being updated.`:'This appointment was already confirmed, so no duplicate was created.','assistant',`Appointment ${data.appointment_id}`)}else{addBubble(data.message||'Your details are preserved, but the appointment is not confirmed.','error','Booking not confirmed');addBubble(`Recovery work item ${data.recovery?.id||''} created · duplicate protection active`,'notice')}}catch(error){addBubble(error.detail?.message||'The appointment could not be confirmed. Nothing has been booked.','error','Booking not confirmed')}}
async function sendMessage(){const text=el('message').value.trim();if(!text)return;if(onboarding==='name'){customerName=text;addBubble(text,'customer','You');el('message').value='';onboarding='complete';el('quick').classList.add('show');el('message').placeholder='Type a message…';addBubble(`Nice to meet you, ${customerName}. What can I help you with today?`,'assistant','Customer Care');return}addBubble(text,'customer','You');el('message').value='';const payload={event_id:`${sessionId}-${Date.now()}`,channel:'demo-messaging',customer_name:customerName||'Demo Visitor',customer_phone:customerPhone||syntheticPhone,text,metadata:{demo_ui:true,transport_claim:'simulated',session_id:sessionId}};if(conversationLeadId)payload.conversation_lead_id=conversationLeadId;await processPayload(payload,route('inbound'))}
async function retryDirect(){if(!lastFailedPayload)return;addBubble('Retrying through the backup route…','notice');await processPayload(lastFailedPayload,directRoutes.inbound)}
function prepareBooking(index){currentVehicle=window.lastInventory[index];bookingKey=`${sessionId}-booking-${currentVehicle.stock_id}`;addBubble(`I can arrange a test drive for the ${currentVehicle.model}. To confirm the request, please provide your phone number, email address and preferred time.`,'assistant','Customer Care');el('bookingCard')?.remove();const card=document.createElement('div');card.className='booking';card.id='bookingCard';card.innerHTML=`<strong>Confirm your test-drive request</strong><small>${esc(currentVehicle.model)} ${esc(currentVehicle.variant)} · ${esc(currentVehicle.branch)}</small><div class="bookingGrid"><div><label>Name</label><input id="contactName" value="${esc(customerName)}" autocomplete="name"></div><div><label>Phone</label><input id="contactPhone" value="${esc(customerPhone)}" placeholder="e.g. +91 98…" autocomplete="tel"></div><div><label>Email</label><input id="contactEmail" value="${esc(customerEmail)}" type="email" placeholder="you@example.com" autocomplete="email"></div><div><label>Preferred time</label><input id="slot" type="datetime-local"></div></div><label>Branch</label><select id="branch"><option>${esc(currentVehicle.branch)}</option></select><button style="margin-top:10px" onclick="bookAppointment(false)">Confirm test drive</button>`;el('messages').appendChild(card);const slot=new Date(Date.now()+86400000);slot.setHours(11,0,0,0);el('slot').value=new Date(slot.getTime()-slot.getTimezoneOffset()*60000).toISOString().slice(0,16);card.scrollIntoView({behavior:'smooth',block:'nearest'})}
async function bookAppointment(replay){if(!conversationLeadId||!currentVehicle)return;const name=(el('contactName')?.value||'').trim(),phone=(el('contactPhone')?.value||'').trim(),email=(el('contactEmail')?.value||'').trim(),slot=el('slot')?.value;if(!name||phone.length<6||!/^\S+@\S+\.\S+$/.test(email)||!slot){addBubble('Please enter your name, a valid phone number, email address and preferred time before I confirm the request.','notice');return}customerName=name;customerPhone=phone;customerEmail=email;const payload=replay?lastBookingPayload:{lead_id:conversationLeadId,kind:'test_drive',branch:el('branch').value,stock_id:currentVehicle.stock_id,scheduled_for:new Date(slot).toISOString(),idempotency_key:bookingKey,contact_name:name,contact_phone:phone,contact_email:email};if(!payload)return;lastBookingPayload=payload;try{const data=await request(route('appointment'),{method:'POST',body:JSON.stringify(payload)});el('bookingCard')?.remove();addBubble(data.created?`Thanks, ${customerName}. Your test-drive request is confirmed for the selected time. We have your contact details on the booking and a team member can follow up with you.`:'That request was already recorded, so no duplicate booking was created.','assistant',`Appointment ${data.appointment_id}`)}catch(error){addBubble('The appointment could not be created. Please check the details or try again after the service recovers.','error')}}
function newConversation(){window.location.reload()}
async function loadConfig(){try{config=await request('/api/demo/config');el('routeStatus').querySelector('span').textContent='Online'}catch{el('routeStatus').querySelector('span').textContent='Limited mode'}}
el('message').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}});loadConfig();el('message').focus();
</script>
</body>
</html>
