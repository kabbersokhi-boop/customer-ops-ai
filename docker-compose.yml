services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_ops}
      POSTGRES_USER: ${POSTGRES_USER:-customer_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_ops_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customer_ops} -d ${POSTGRES_DB:-customer_ops}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-customer_ops}:${POSTGRES_PASSWORD:-customer_ops_local}@postgres:5432/${POSTGRES_DB:-customer_ops}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-z-ai/glm-5.3-flash}
      NVIDIA_NIM_TIMEOUT_SECONDS: ${NVIDIA_NIM_TIMEOUT_SECONDS:-25}
      NVIDIA_NIM_MAX_RETRIES: ${NVIDIA_NIM_MAX_RETRIES:-2}
      AIRTABLE_API_KEY: ${AIRTABLE_API_KEY:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
      AIRTABLE_BASE_WEB_URL: ${AIRTABLE_BASE_WEB_URL:-}
      AIRTABLE_ENABLED: ${AIRTABLE_ENABLED:-false}
      AIRTABLE_BASE_URL: ${AIRTABLE_BASE_URL:-https://api.airtable.com/v0}
      AIRTABLE_TIMEOUT_SECONDS: ${AIRTABLE_TIMEOUT_SECONDS:-15}
      AIRTABLE_MAX_RETRIES: ${AIRTABLE_MAX_RETRIES:-2}
      AIRTABLE_CUSTOMERS_TABLE: ${AIRTABLE_CUSTOMERS_TABLE:-Customers}
      AIRTABLE_LEADS_TABLE: ${AIRTABLE_LEADS_TABLE:-Leads}
      AIRTABLE_ACTIVITIES_TABLE: ${AIRTABLE_ACTIVITIES_TABLE:-Activities}
      AIRTABLE_APPOINTMENTS_TABLE: ${AIRTABLE_APPOINTMENTS_TABLE:-Appointments}
      AIRTABLE_APPROVALS_TABLE: ${AIRTABLE_APPROVALS_TABLE:-Approval Requests}
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-direct}
      N8N_INBOUND_WEBHOOK_URL: ${N8N_INBOUND_WEBHOOK_URL:-}
      N8N_APPOINTMENT_WEBHOOK_URL: ${N8N_APPOINTMENT_WEBHOOK_URL:-}
      N8N_UI_BASE_URL: ${N8N_UI_BASE_URL:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "python scripts/seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
